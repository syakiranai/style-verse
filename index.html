<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff5f8" />
    <title>Styleverse — Find your everyday style</title>
    <meta
      name="description"
      content="Editorial women's fashion lookbook, occasion style guide, and interactive dressing-room studio."
    />
    <meta property="og:title" content="Styleverse — Find your everyday style" />
    <meta
      property="og:description"
      content="Mix, match, and discover everyday women's outfits in the interactive Styleverse dressing studio."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;700&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header" id="site-header"></header>

    <main id="main-content" tabindex="-1">
      <section class="view" id="view-home" aria-label="Home"></section>
      <section class="view" id="view-explore" aria-label="Explore Looks"></section>
      <section class="view" id="view-guide" aria-label="Style Guide"></section>
      <section class="view" id="view-studio" aria-label="Dressing Studio"></section>
      <section class="view" id="view-favorites" aria-label="Favorites"></section>
      <section class="view" id="view-cart" aria-label="Shopping Bag and Checkout"></section>
      <section class="view" id="view-operator" aria-label="Operator Workspace"></section>
      <section class="view" id="view-admin" aria-label="Admin Console"></section>
      <section class="view" id="view-login" aria-label="Portal Login"></section>
      <section class="view" id="view-login-user" aria-label="Login User Biasa"></section>
      <section class="view" id="view-login-operator" aria-label="Login Operator"></section>
      <section class="view" id="view-login-admin" aria-label="Login Admin"></section>
    </main>

    <footer class="site-footer" id="site-footer"></footer>

    <div
      class="modal-backdrop"
      id="modal-backdrop"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
      hidden
    >
      <div class="modal-panel" id="modal-panel"></div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
